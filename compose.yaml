name: customer-complaint

services:
  app:
    image: ${IMAGE:-mate-docker-register-cn-north-1.jcr.service.jdcloud.com/mate-customer-complaint:v4}
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
